name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon from icon.png
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx --yes @capacitor/assets generate --android \
              || echo "WARN: не удалось сгенерировать иконку, останется стандартная"
          else
            echo "WARN: icon.png не найден, останется стандартная иконка"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Prepare keystore (создать один раз и сохранить в репозиторий)
        run: |
          if [ -f app.keystore ]; then
            keytool -list -keystore app.keystore -storepass android >/dev/null 2>&1 || rm -f app.keystore
          fi
          if [ ! -f app.keystore ]; then
            keytool -genkeypair -v -keystore app.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Kochegar, OU=Dev, O=Dev, L=City, ST=State, C=RU"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add app.keystore
            git commit -m "add app.keystore [skip ci]"
            git push
          fi

      - name: Add signing config
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('../../app.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'android'
                      keyAlias System.getenv('KEY_ALIAS') ?: 'android'
                      keyPassword System.getenv('KEY_PASSWORD') ?: 'android'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kochegar-apk
          path: android/app/build/outputs/apk/release/app-release.apk
