<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Учёт заявок</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --border: #e5e7eb; --zebra: #f9fafb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .container { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .connection-indicator { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid #fff; }
  .connection-indicator.online { background: var(--success); }
  .connection-indicator.offline { background: var(--danger); }
  .tabs-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; background: var(--card); border: 1px solid var(--border); font-size: 14px; color: var(--muted); touch-action: manipulation; }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .clear-all-btn { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 8px; background: var(--danger); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; flex-shrink: 0; }
  .clear-all-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .summary-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .summary-total { font-size: 28px; font-weight: 700; color: var(--text); }
  .summary-breakdown { font-size: 16px; font-weight: 600; }
  .summary-breakdown .debt { color: var(--danger); }
  .summary-breakdown .income { color: var(--success); }
  .summary-digital { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #8b5cf6; }
  .summary-digital .icon { width: 18px; height: 18px; }
  .form { display: grid; gap: 12px; grid-template-columns: 2fr 1fr auto; align-items: end; }
  .form .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .checkbox-row input { width: 18px; height: 18px; }
  button { padding: 12px 16px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; font-weight: 500; touch-action: manipulation; min-height: 44px; }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); }
  button:disabled { background: var(--muted); cursor: not-allowed; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; align-items: center; }
  .item:nth-child(even) { background-color: var(--zebra); }
  .item .desc { font-size: 14px; }
  .item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .amount-wrap { display: flex; align-items: center; gap: 8px; }
  .amount { font-weight: 600; font-size: 16px; }
  .icon { width: 24px; height: 24px; flex-shrink: 0; }
  .icon.cash { color: #16a34a; }
  .icon.digital { color: #8b5cf6; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; touch-action: manipulation; }
  .history-item:nth-child(even) { background-color: var(--zebra); }
  .history-dates { font-size: 14px; color: var(--muted); }
  .history-dates .arrow { margin: 0 6px; }
  .history-total { font-weight: 600; font-size: 16px; }
  .status-open { color: var(--success); font-weight: 600; }
  .detail-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .back-btn { background: none; color: var(--primary); padding: 8px 12px; font-size: 14px; border: none; cursor: pointer; touch-action: manipulation; min-height: 44px; }
  .detail-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: var(--bg); }
  .auth-card { background: var(--card); border-radius: 12px; padding: 32px 24px; max-width: 400px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .auth-title { font-size: 24px; font-weight: 700; text-align: center; margin: 0 0 24px; }
  .auth-subtitle { font-size: 14px; color: var(--muted); text-align: center; margin: 0 0 24px; }
  .pin-input { width: 100%; padding: 16px; font-size: 28px; text-align: center; letter-spacing: 12px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 16px; background: #fff; color: var(--text); }
  .pin-input:focus { outline: none; border-color: var(--primary); }
  .auth-error { color: var(--danger); font-size: 14px; text-align: center; margin: 12px 0; min-height: 20px; }
  .auth-btn { width: 100%; padding: 14px; font-size: 16px; }
  .auth-status { text-align: center; font-size: 32px; color: var(--muted); margin-top: 12px; word-break: break-word; font-weight: 700; min-height: 48px; display: flex; align-items: center; justify-content: center; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; max-width: 400px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
  .modal-title { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  .modal-title.danger { color: var(--danger); }
  .modal-text { color: var(--muted); font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { flex: 1; }
  
  .spinner {
    display: inline-block;
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .status-mark { line-height: 1; }
  .status-mark.ok { color: var(--success); }
  .status-mark.err { color: var(--danger); }
  
  @media (max-width: 600px) { .form { grid-template-columns: 1fr; } .item { grid-template-columns: 1fr; } .summary-main { flex-direction: row; align-items: center; flex-wrap: wrap; } .history-item { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h2 class="auth-title">📋 Kochegar</h2>
    <p class="auth-subtitle">Введите PIN-код</p>
    <input type="password" class="pin-input" id="pin-input" placeholder="••••" maxlength="6" inputmode="numeric" autocomplete="off">
    <div class="auth-error" id="auth-error"></div>
    <button class="auth-btn" id="auth-btn" disabled>Загрузка...</button>
    <div class="auth-status" id="auth-status"></div>
  </div>
</div>

<div id="app-container" style="display:none;">
<div class="container">
  <header>
    <h1>📋 Kochegar <span class="connection-indicator offline" id="connection-indicator"></span></h1>
  </header>
  <div class="tabs-row">
    <div class="tabs">
      <div class="tab active" data-tab="current">Текущий период</div>
      <div class="tab" data-tab="history">История</div>
    </div>
    <button class="clear-all-btn" id="clear-all-btn" title="Удалить все данные">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <section id="tab-current">
    <div id="no-period" class="card empty">Нет открытого периода. Нажмите «Открыть период», чтобы начать.</div>
    <div id="active-period" style="display:none;">
      <div class="card">
        <div class="summary-main">
          <div class="summary-total" id="period-total">0</div>
          <div class="summary-breakdown">[<span class="debt" id="period-debt">0</span> / <span class="income" id="period-income">0</span>]</div>
          <div class="summary-digital">
            <svg class="icon digital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/>
              <path d="M9 9 L12 6 L15 9" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="12" y1="6" x2="12" y2="12" stroke-linecap="round"/>
            </svg>
            <span id="period-digital">0</span>
          </div>
        </div>
        <div style="margin-top: 12px; text-align: right;">
          <div style="font-size:13px; color:var(--muted);" id="period-dates"></div>
          <div class="status-open">● Открыт</div>
        </div>
      </div>
      <div class="card">
        <div class="form">
          <div class="full"><label for="description">Описание заявки</label><input type="text" id="description" placeholder="Например: Заказ №123"></div>
          <div><label for="amount">Сумма (целое число)</label><input type="number" id="amount" step="1" min="0" placeholder="0"></div>
          <div class="checkbox-row"><input type="checkbox" id="cash"><label for="cash" style="margin:0; color:var(--text);">Оплата на карту</label></div>
          <div><button type="button" id="add-btn">Добавить</button></div>
        </div>
      </div>
      <div class="card"><h3 style="margin:0 0 12px;">Заявки периода</h3><div id="requests-list" class="list"></div></div>
      <div class="card" style="display:flex; justify-content:flex-end;"><button class="danger" id="close-period-btn">Закрыть период</button></div>
    </div>
    <div id="open-period-wrap"><button id="open-period-btn">Открыть период</button></div>
  </section>
  <section id="tab-history" style="display:none;">
    <div id="history-list-view"></div>
    <div id="history-detail-view" style="display:none;"></div>
  </section>
</div>
</div>

<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3 class="modal-title">Удалить период?</h3>
    <p class="modal-text" id="delete-modal-text"></p>
    <div class="modal-actions">
      <button class="secondary" id="delete-cancel-btn">Отмена</button>
      <button class="danger" id="delete-confirm-btn">Удалить</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-pin-modal">
  <div class="modal">
    <h3 class="modal-title">Подтверждение</h3>
    <p class="modal-text">Введите PIN-код для подтверждения:</p>
    <input type="password" class="pin-input" id="confirm-pin-input" placeholder="••••" maxlength="6" inputmode="numeric" autocomplete="off">
    <div class="auth-error" id="confirm-pin-error"></div>
    <div class="modal-actions">
      <button class="secondary" id="confirm-pin-cancel-btn">Отмена</button>
      <button class="danger" id="confirm-pin-ok-btn">OK</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://ptmkfycgtgomovyndldv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0bWtmeWNndGdvbW92eW5kbGR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzc5NjMsImV4cCI6MjEwMDk1Mzk2M30.AgMbu9W8pf0HFxM2zjPaPXHfNNHBYNydkzmDPz5sV-4';

let sbClient = null;
let state = { periods: [] };
let selectedPeriodId = null;
let periodToDeleteId = null;
let LOGIN_PIN = '';
let DELETE_PIN = '';
let dbConnected = false;
let pendingAction = null;

function generateId() {
  return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
}

// Показывает только значок: спиннер / галочка / крест
function setDbStatus(state) {
  const el = document.getElementById('auth-status');
  const btn = document.getElementById('auth-btn');
  if (!el) return;
  if (state === 'connecting') {
    el.innerHTML = '<span class="spinner"></span>';
    if (btn) { btn.disabled = true; btn.textContent = 'Подключение...'; }
  } else if (state === 'ok') {
    el.innerHTML = '<span class="status-mark ok">✓</span>';
    if (btn) { btn.disabled = false; btn.textContent = 'Войти'; }
  } else {
    el.innerHTML = '<span class="status-mark err">✗</span>';
    if (btn) { btn.disabled = true; btn.textContent = 'Ошибка'; }
  }
}

function dbToApp(row) {
  if (!row) return null;
  return {
    id: row.id,
    openedAt: row.opened_at,
    closedAt: row.closed_at,
    createdAt: row.created_at,
    requests: Array.isArray(row.requests) ? row.requests : (typeof row.requests === 'string' ? JSON.parse(row.requests) : [])
  };
}

function appToDb(period) {
  return {
    id: period.id,
    opened_at: period.openedAt,
    closed_at: period.closedAt,
    requests: period.requests
  };
}

async function initSupabase() {
  setDbStatus('connecting');
  
  try {
    const lib = window.supabase;
    if (!lib || !lib.createClient) throw new Error('Библиотека Supabase не загружена');
    
    sbClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const { data, error } = await sbClient.from('periods').select('id').limit(1);
    if (error) throw new Error('БД: ' + error.message);
    
    const { data: pinsData, error: pinsError } = await sbClient.from('app_pins').select('*').eq('id', 1).single();
    if (pinsError) throw new Error('PIN: ' + pinsError.message);
    
    LOGIN_PIN = String(pinsData.login_pin_hash);
    DELETE_PIN = String(pinsData.delete_pin_hash);
    
    setDbStatus('ok');
    dbConnected = true;
    updateConnectionStatus();
    return true;
  } catch (e) {
    console.error('Ошибка:', e);
    setDbStatus('error');
    dbConnected = false;
    updateConnectionStatus();
    return false;
  }
}

async function loadPeriods() {
  try {
    const { data, error } = await sbClient.from('periods').select('*').order('opened_at', { ascending: false });
    if (error) throw error;
    state.periods = (data || []).map(dbToApp);
    return state.periods;
  } catch (e) { 
    console.error(e); 
    alert(' ' + e.message); 
    return []; 
  }
}

async function savePeriod(period) {
  try {
    const dbPeriod = appToDb(period);
    const { error } = await sbClient.from('periods').upsert(dbPeriod);
    if (error) throw error;
    return true;
  } catch (e) { 
    console.error(e); 
    alert('🖕 ' + e.message); 
    return false; 
  }
}

async function deletePeriod(periodId) {
  try {
    const { error } = await sbClient.from('periods').delete().eq('id', periodId);
    if (error) throw error;
    return true;
  } catch (e) { 
    console.error(e); 
    alert(' ' + e.message); 
    return false; 
  }
}

async function deleteAllPeriods() {
  try {
    const { error } = await sbClient.from('periods').delete().neq('id', '');
    if (error) throw error;
    return true;
  } catch (e) { 
    console.error(e); 
    alert('🖕 ' + e.message); 
    return false; 
  }
}

function updateConnectionStatus() {
  const indicator = document.getElementById('connection-indicator');
  if (!indicator) return;
  const online = navigator.onLine && dbConnected;
  indicator.className = 'connection-indicator ' + (online ? 'online' : 'offline');
}

window.addEventListener('online', () => { updateConnectionStatus(); });
window.addEventListener('offline', updateConnectionStatus);

function calculatePeriodStats(period) {
  const total = period.requests.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
  const digitalTotal = period.requests.filter(r => r.isCash).reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
  const income = Math.floor(total * 0.45);
  const debt = Math.floor(total * 0.55) - digitalTotal;
  return { total, debt, income, digitalTotal };
}

function currentPeriod() { 
  return state.periods.find(p => !p.closedAt) || null; 
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtDateOnly(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getPaymentIcon(isCash) {
  if (isCash) {
    return '<svg class="icon digital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/><path d="M9 9 L12 6 L15 9" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="6" x2="12" y2="12" stroke-linecap="round"/></svg>';
  } else {
    return '<svg class="icon cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><line x1="6" y1="12" x2="6.01" y2="12"/><line x1="18" y1="12" x2="18.01" y2="12"/></svg>';
  }
}

function render() {
  const active = currentPeriod();
  const noPeriod = document.getElementById('no-period');
  const activeBlock = document.getElementById('active-period');
  const openWrap = document.getElementById('open-period-wrap');

  if (active) {
    noPeriod.style.display = 'none'; 
    activeBlock.style.display = 'block'; 
    openWrap.style.display = 'none';
    const stats = calculatePeriodStats(active);
    document.getElementById('period-total').textContent = stats.total;
    document.getElementById('period-debt').textContent = stats.debt;
    document.getElementById('period-income').textContent = stats.income;
    document.getElementById('period-digital').textContent = stats.digitalTotal;
    document.getElementById('period-dates').innerHTML = 'Открыт: ' + fmtDate(active.openedAt);
    const list = document.getElementById('requests-list');
    if (active.requests.length === 0) {
      list.innerHTML = '<div class="empty">Пока нет заявок</div>';
    } else {
      list.innerHTML = active.requests.slice().reverse().map(r => 
        '<div class="item"><div><div class="desc">' + escapeHtml(r.description) + '</div><div class="meta">' + fmtDate(r.createdAt) + '</div></div><div class="amount-wrap">' + getPaymentIcon(r.isCash) + '<div class="amount">' + (Number(r.amount) || 0) + '</div></div></div>'
      ).join('');
    }
  } else {
    noPeriod.style.display = 'block'; 
    activeBlock.style.display = 'none'; 
    openWrap.style.display = 'block';
  }
  renderHistory();
}

function renderHistory() {
  const closed = state.periods.filter(p => p.closedAt).slice().reverse();
  const wrap = document.getElementById('history-list-view');
  const detailWrap = document.getElementById('history-detail-view');

  if (selectedPeriodId) {
    const period = state.periods.find(p => p.id === selectedPeriodId);
    if (!period || !period.closedAt) selectedPeriodId = null;
  }

  if (selectedPeriodId) {
    wrap.style.display = 'none'; 
    detailWrap.style.display = 'block';
    renderPeriodDetail(selectedPeriodId);
  } else {
    wrap.style.display = 'block'; 
    detailWrap.style.display = 'none';
    if (closed.length === 0) { 
      wrap.innerHTML = '<div class="card empty">История пуста</div>'; 
      return; 
    }
    wrap.innerHTML = closed.map(p => {
      const stats = calculatePeriodStats(p);
      return '<div class="history-item" data-period-id="' + p.id + '"><div class="history-dates">' + fmtDateOnly(p.openedAt) + '<span class="arrow">→</span>' + fmtDateOnly(p.closedAt) + '</div><div class="history-total">' + stats.total + ' <span style="color:var(--danger); font-size:14px;">[' + stats.debt + '</span> / <span style="color:var(--success); font-size:14px;">' + stats.income + ']</span></div></div>';
    }).join('');
  }
}

function renderPeriodDetail(periodId) {
  const period = state.periods.find(p => p.id === periodId);
  if (!period) return;
  const stats = calculatePeriodStats(period);
  const wrap = document.getElementById('history-detail-view');
  let requestsHtml = '';
  if (period.requests.length === 0) {
    requestsHtml = '<div class="empty">В этом периоде нет заявок</div>';
  } else {
    requestsHtml = period.requests.slice().reverse().map(r => 
      '<div class="item"><div><div class="desc">' + escapeHtml(r.description) + '</div><div class="meta">' + fmtDate(r.createdAt) + '</div></div><div class="amount-wrap">' + getPaymentIcon(r.isCash) + '<div class="amount">' + (Number(r.amount) || 0) + '</div></div></div>'
    ).join('');
  }
  wrap.innerHTML = '<div class="card"><div class="detail-header"><button class="back-btn" id="back-btn">← Назад к истории</button><div style="text-align:right;"><div style="font-size:14px; color:var(--muted);">' + fmtDateOnly(period.openedAt) + ' → ' + fmtDateOnly(period.closedAt) + '</div></div></div><div class="summary-main"><div class="summary-total">' + stats.total + '</div><div class="summary-breakdown">[<span class="debt">' + stats.debt + '</span> / <span class="income">' + stats.income + '</span>]</div><div class="summary-digital"><svg class="icon digital" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/><path d="M9 9 L12 6 L15 9" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="6" x2="12" y2="12" stroke-linecap="round"/></svg><span>' + stats.digitalTotal + '</span></div></div></div><div class="card"><h3 style="margin:0 0 12px;">Заявки периода (' + period.requests.length + ')</h3><div class="list">' + requestsHtml + '</div></div><div class="card detail-actions"><button class="danger" id="delete-period-btn">Удалить период</button></div>';
}

function handleAuth() {
  const pinInput = document.getElementById('pin-input');
  const errorDiv = document.getElementById('auth-error');
  const pin = pinInput.value.trim();
  
  if (pin.length < 4) { errorDiv.textContent = 'PIN должен содержать минимум 4 цифры'; pinInput.value = ''; pinInput.focus(); return; }
  
  if (pin === LOGIN_PIN) { 
    errorDiv.textContent = ''; 
    showApp(); 
  } else if (pin === DELETE_PIN) { 
    errorDiv.textContent = '';
    showConfirmPinModal(() => {
      deleteAllPeriods().then((success) => {
        state.periods = []; 
        selectedPeriodId = null;
        hideConfirmPinModal(); 
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-container').style.display = 'none';
        pinInput.value = '';
        errorDiv.textContent = '';
      });
    });
  } else { 
    errorDiv.textContent = 'Неверный PIN-код'; 
    pinInput.value = ''; 
    pinInput.focus(); 
  }
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-container').style.display = 'block';
  loadPeriods().then(() => render());
}

function showConfirmPinModal(actionCallback) {
  pendingAction = actionCallback;
  document.getElementById('confirm-pin-modal').classList.add('active');
  document.getElementById('confirm-pin-input').value = '';
  document.getElementById('confirm-pin-error').textContent = '';
  setTimeout(() => document.getElementById('confirm-pin-input').focus(), 100);
}

function hideConfirmPinModal() { 
  document.getElementById('confirm-pin-modal').classList.remove('active');
  pendingAction = null;
}

function handleConfirmPin() {
  const input = document.getElementById('confirm-pin-input');
  const errorDiv = document.getElementById('confirm-pin-error');
  const pin = input.value.trim();
  
  if (pin.length < 4) { 
    errorDiv.textContent = 'PIN должен содержать минимум 4 цифры'; 
    return; 
  }
  
  if (pin === DELETE_PIN) {
    if (pendingAction) pendingAction();
  } else { 
    errorDiv.textContent = 'PIN-код не совпадает'; 
    input.value = ''; 
    input.focus(); 
  }
}

function addRequest() {
  const active = currentPeriod();
  if (!active) { alert('Нет открытого периода'); return; }
  const descInput = document.getElementById('description');
  const amountInput = document.getElementById('amount');
  const cashInput = document.getElementById('cash');
  const desc = descInput.value.trim();
  const rawAmount = amountInput.value;
  const isCash = cashInput.checked;
  if (!desc) { alert('Введите описание'); descInput.focus(); return; }
  if (rawAmount === '') { alert('Введите сумму'); amountInput.focus(); return; }
  let amount = 0;
  const parsed = Math.floor(Number(rawAmount));
  if (isNaN(parsed) || parsed < 0) { alert('Сумма должна быть целым неотрицательным числом'); amountInput.focus(); return; }
  amount = parsed;
  active.requests.push({ id: generateId(), createdAt: new Date().toISOString(), description: desc, amount: amount, isCash: isCash });
  savePeriod(active).then(() => loadPeriods().then(() => render()));
  descInput.value = ''; amountInput.value = ''; cashInput.checked = false; descInput.focus();
}

function showDeleteModal(periodId) {
  const period = state.periods.find(p => p.id === periodId);
  if (!period) return;
  periodToDeleteId = periodId;
  document.getElementById('delete-modal-text').textContent = 'Период за ' + fmtDateOnly(period.openedAt) + ' — ' + fmtDateOnly(period.closedAt) + '. Заявок: ' + period.requests.length + '. Это действие нельзя отменить.';
  document.getElementById('delete-modal').classList.add('active');
}

function hideDeleteModal() { document.getElementById('delete-modal').classList.remove('active'); periodToDeleteId = null; }

function confirmDelete() {
  if (!periodToDeleteId) return;
  deletePeriod(periodToDeleteId).then(() => loadPeriods().then(() => {
    selectedPeriodId = null; 
    hideDeleteModal(); 
    renderHistory();
  }));
}

function showClearAllModal() { 
  showConfirmPinModal(() => {
    deleteAllPeriods().then((success) => {
      state.periods = []; 
      selectedPeriodId = null;
      hideConfirmPinModal(); 
      render();
    });
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  await initSupabase();
  
  document.getElementById('auth-btn').addEventListener('click', handleAuth);
  document.getElementById('pin-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAuth(); });
  
  document.getElementById('confirm-pin-ok-btn').addEventListener('click', handleConfirmPin);
  document.getElementById('confirm-pin-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleConfirmPin(); });
  document.getElementById('confirm-pin-cancel-btn').addEventListener('click', hideConfirmPinModal);
  document.getElementById('confirm-pin-modal').addEventListener('click', (e) => { if (e.target.id === 'confirm-pin-modal') hideConfirmPinModal(); });

  document.getElementById('open-period-btn').addEventListener('click', () => {
    const newPeriod = { id: generateId(), openedAt: new Date().toISOString(), closedAt: null, requests: [] };
    savePeriod(newPeriod).then(() => loadPeriods().then(() => render()));
    document.getElementById('description').focus();
  });

  document.getElementById('close-period-btn').addEventListener('click', () => {
    const active = currentPeriod();
    if (!active) return;
    active.closedAt = new Date().toISOString();
    savePeriod(active).then(() => loadPeriods().then(() => render()));
  });

  document.getElementById('add-btn').addEventListener('click', addRequest);
  document.getElementById('clear-all-btn').addEventListener('click', showClearAllModal);

  document.getElementById('history-list-view').addEventListener('click', (e) => {
    const item = e.target.closest('.history-item');
    if (!item) return;
    selectedPeriodId = item.getAttribute('data-period-id');
    renderHistory();
  });

  document.getElementById('history-detail-view').addEventListener('click', (e) => {
    const backBtn = e.target.closest('#back-btn');
    if (backBtn) { selectedPeriodId = null; renderHistory(); return; }
    const deleteBtn = e.target.closest('#delete-period-btn');
    if (deleteBtn) { showDeleteModal(selectedPeriodId); return; }
  });

  document.getElementById('delete-cancel-btn').addEventListener('click', hideDeleteModal);
  document.getElementById('delete-confirm-btn').addEventListener('click', confirmDelete);
  document.getElementById('delete-modal').addEventListener('click', (e) => { if (e.target.id === 'delete-modal') hideDeleteModal(); });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const name = tab.dataset.tab;
      document.getElementById('tab-current').style.display = name === 'current' ? '' : 'none';
      document.getElementById('tab-history').style.display = name === 'history' ? '' : 'none';
      if (name === 'history') { selectedPeriodId = null; renderHistory(); }
    });
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW error:', err));
  }
});
</script>
</body>
</html>
